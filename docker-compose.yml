services:
  openlocalbot-gateway:
    image: ${openlocalbot_IMAGE:-openlocalbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      openlocalbot_GATEWAY_TOKEN: ${openlocalbot_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${openlocalbot_CONFIG_DIR}:/home/node/.openlocalbot
      - ${openlocalbot_WORKSPACE_DIR}:/home/node/.openlocalbot/workspace
    ports:
      - "${openlocalbot_GATEWAY_PORT:-18789}:18789"
      - "${openlocalbot_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${openlocalbot_GATEWAY_BIND:-lan}",
        "--port",
        "${openlocalbot_GATEWAY_PORT:-18789}",
      ]

  openlocalbot-cli:
    image: ${openlocalbot_IMAGE:-openlocalbot:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${openlocalbot_CONFIG_DIR}:/home/node/.openlocalbot
      - ${openlocalbot_WORKSPACE_DIR}:/home/node/.openlocalbot/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
