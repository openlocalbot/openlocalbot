services:
  - type: web
    name: openlocalbot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: openlocalbot_STATE_DIR
        value: /data/.openlocalbot
      - key: openlocalbot_WORKSPACE_DIR
        value: /data/workspace
      - key: openlocalbot_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openlocalbot-data
      mountPath: /data
      sizeGB: 1
